# Ubuntu
#
# Autoinstall profiles: place user-data + meta-data under
#   /boot/iso/ubuntu/profiles/<profile-name>/
# A GRUB entry appears automatically for each profile whose user-data exists.
# To add a profile: add its name (space-separated) to autoinstall_profiles
# and create the seed directory on the USB stick.
set autoinstall_profiles="platform-engineer qa-engineer software-engineer"

function add_menu {
  isofile="$1"

  regexp \
    --set 1:isoname \
    --set 2:version \
    --set 3:variant \
    --set 4:arch \
    "^${isopath}/ubuntu/(ubuntu-([^-]+)-(.+)-([^-]+)\.iso)\$" "${isofile}"

  menuentry "Ubuntu ${version} ${arch} ${variant}" "${isofile}" "${isoname}" --class ubuntu {
    set isofile=$2
    set isoname=$3
    use "${isoname}"
    loop $isofile
    linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=${isofile} fsck.mode=skip quiet splash
    initrd (loop)/casper/initrd*
  }

  # One autoinstall entry per profile. The profile name is passed as $4 so it
  # is captured at menuentry-definition time (not loop-variable time), ensuring
  # each entry gets the correct seed path regardless of how many profiles exist.
  for profile in ${autoinstall_profiles}; do
    if any_exists "${isopath}/ubuntu/profiles/${profile}/user-data"; then
      menuentry "Ubuntu ${version} ${arch} ${variant} — Autoinstall (${profile})" \
          "${isofile}" "${isoname}" "${profile}" --class ubuntu {
        set isofile=$2
        set isoname=$3
        set profile=$4
        use "${isoname}"
        loop $isofile
        linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=${isofile} fsck.mode=skip quiet splash \
          autoinstall "ds=nocloud;s=hd:UUID=${rootuuid}:/boot/iso/ubuntu/profiles/${profile}/"
        initrd (loop)/casper/initrd*
      }
    fi
  done
}

for_each_sorted add_menu "$isopath"/ubuntu/ubuntu-*.iso
