# Ubuntu
#
# Autoinstall: place the rendered user-data + meta-data on the CIDATA partition
# using deploy-profile.sh before booting. Two autoinstall entries appear when
# the CIDATA partition carries a .distro-ubuntu--<profile> marker:
#
#   Autoinstall (<profile>)            — pre-fills the installer UI; confirm each step
#   Autoinstall (<profile>) Unattended — fully automatic, no interaction
#
# To add a profile: create autoinstall/templates/ubuntu/<profile-name>/ and
# run glim.sh to sync. Then run deploy-profile.sh to activate it on CIDATA.
set autoinstall_profiles="platform-engineer qa-engineer software-engineer"

# Discover which Ubuntu profile (if any) is active on the CIDATA partition.
# deploy-profile.sh writes .distro-ubuntu--<profile> and removes old markers,
# so at most one profile is active at a time.
set ubuntu_cidata_profile=""
if search --no-floppy --label --set=cidataroot CIDATA; then
  for profile in ${autoinstall_profiles}; do
    if [ -f "(${cidataroot})/.distro-ubuntu--${profile}" ]; then
      set ubuntu_cidata_profile="${profile}"
    fi
  done
fi

function add_menu {
  isofile="$1"

  regexp \
    --set 1:isoname \
    --set 2:version \
    --set 3:variant \
    --set 4:arch \
    "^${isopath}/ubuntu/(ubuntu-([^-]+)-(.+)-([^-]+)\.iso)\$" "${isofile}"

  # Live entry: cloud-init disabled so CIDATA is not picked up automatically.
  menuentry "Ubuntu ${version} ${arch} ${variant}" "${isofile}" "${isoname}" --class ubuntu {
    set isofile=$2
    set isoname=$3
    use "${isoname}"
    loop $isofile
    linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=${isofile} fsck.mode=skip quiet splash cloud-init=disabled
    initrd (loop)/casper/initrd*
  }

  if [ -n "${ubuntu_cidata_profile}" ]; then
    # Review entry: boots the installer with CIDATA pre-filling the UI.
    # The installer pauses at each section for confirmation before proceeding.
    menuentry "Ubuntu ${version} ${arch} ${variant} — Autoinstall (${ubuntu_cidata_profile})" \
        "$1" "${isoname}" --class ubuntu {
      set isofile=$2
      set isoname=$3
      use "${isoname}"
      loop $isofile
      linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=${isofile} fsck.mode=skip quiet splash \
        "ds=nocloud"
      initrd (loop)/casper/initrd*
    }

    # Unattended entry: fully automatic, no confirmation.
    menuentry "Ubuntu ${version} ${arch} ${variant} — Autoinstall (${ubuntu_cidata_profile}) Unattended" \
        "$1" "${isoname}" --class ubuntu {
      set isofile=$2
      set isoname=$3
      use "${isoname}"
      loop $isofile
      linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=${isofile} fsck.mode=skip quiet splash \
        autoinstall "ds=nocloud"
      initrd (loop)/casper/initrd*
    }
  fi
}

for_each_sorted add_menu "$isopath"/ubuntu/ubuntu-*.iso
